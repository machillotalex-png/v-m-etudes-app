function clientsSectionHtml(){
  const filtered = matchesSearchList(clientsListData, c=>[c.nom, c.contact, c.telephone, c.email]);
  return `
    <div class="devis-toolbar">
      <p class="agenda-summary">${clientsListData.length} client${clientsListData.length>1?'s':''}</p>
      <input type="text" id="searchBox" class="search-box" placeholder="🔍 Rechercher un client…" value="${escapeHtml(searchQuery)}">
      <button class="btn-new" id="btnNewClient">+ Nouveau client</button>
    </div>
    <div class="devis-grid">
      ${filtered.length===0 ? `<div class="empty">${emptyIconSvg()}<strong>${searchQuery?'Aucun résultat':'Aucun client'}</strong>${searchQuery?'Essaie un autre terme de recherche.':'Ajoute tes clients pour les retrouver rapidement dans les chantiers et devis.'}</div>` :
        filtered.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).map(c=>clientCardHtml(c)).join('')

}

function clientCardHtml(c){

  const nbDevis = devisListData.filter(d=>d.clientId===c.id || (!d.clientId && d.client===c.nom)).length;
  return `
    <div class="devis-card" data-id="${c.id}">
      <div class="devis-card-numero">${escapeHtml(c.telephone || c.email || '—')}</div>
      <div class="devis-card-client">${escapeHtml(c.nom||'Client sans nom')}</div>
      <div class="devis-card-chantier">${escapeHtml(c.adresse||'Adresse non renseignée')}</div>
      <div class="devis-card-foot">
        <span>${nbChantiers} chantier${nbChantiers>1?'s':''} · ${nbDevis} devis</span>
      </div>
    </div>
  `;
}

function exportClientVcard(c){
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${c.nom||'Client'}`,
    `N:${c.nom||'Client'};;;;`,
  ];
  if(c.contact) lines.push(`NOTE:Contact : ${c.contact}`);
  if(c.telephone) lines.push(`TEL;TYPE=CELL:${c.telephone}`);
  if(c.email) lines.push(`EMAIL:${c.email}`);
  if(c.adresse) lines.push(`ADR;TYPE=WORK:;;${c.adresse.replace(/\n/g,', ')};;;;`);
  lines.push('ORG:Client V&M Études');
  lines.push('END:VCARD');

  const blob = new Blob([lines.join('\r\n')], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(c.nom||'client').replace(/[^a-z0-9]+/gi,'-')}.vcf`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const PAIEMENT_STATUS = [
  {id:'a_payer', label:'À payer'},
  {id:'payee', label:'Payée'},
];
const paiementLabel = id => (PAIEMENT_STATUS.find(s=>s.id===id)||{}).label || 'À payer';

function computeFactureTotals(f){ return computeDevisTotals(f); }

function facturesSectionHtml(){
  const totalDu = facturesListData.filter(f=>(f.statutPaiement||'a_payer')==='a_payer')
    .reduce((sum,f)=> sum + computeFactureTotals(f).totalTTC, 0);
  const filtered = matchesSearchList(facturesListData, f=>[f.numero, displayClientName(f)]);
  return `
    <div class="devis-toolbar">
      <p class="agenda-summary">${facturesListData.length} facture${facturesListData.length>1?'s':''} · ${fmtMontant(totalDu)} en attente de paiement</p>
      <input type="text" id="searchBox" class="search-box" placeholder="🔍 Rechercher une facture…" value="${escapeHtml(searchQuery)}">
      <button class="btn-new" id="btnNewFacture">+ Nouvelle facture</button>
    </div>
    <div class="devis-grid">
      ${filtered.length===0 ? `<div class="empty">${emptyIconSvg()}<strong>${searchQuery?'Aucun résultat':'Aucune facture'}</strong>${searchQuery?'Essaie un autre terme de recherche.':'Génère une facture depuis un devis accepté, ou crée-la librement ici.'}</div>` :
        filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(f=>factureCardHtml(f)).join('')
      }
    </div>
  `;
}

function factureCardHtml(f){
  const totals = computeFactureTotals(f);
  const st = f.statutPaiement || 'a_payer';
  const chantier = f.chantierId ? chantiers.find(c=>c.id===f.chantierId) : null;
  return `
    <div class="devis-card devis-card-${st==='payee'?'accepte':'refuse'}" data-id="${f.id}">
      <div class="devis-card-top-row">
        <div class="devis-card-numero">${escapeHtml(f.numero||'')}</div>
        <span class="devis-status-chip ${st==='payee'?'ds-accepte':'ds-refuse'}">${paiementLabel(st)}</span>
      </div>
      <div class="devis-card-client">${escapeHtml(displayClientName(f)||'Client non renseigné')}</div>
      <div class="devis-card-chantier">${chantier ? escapeHtml(chantier.numero+' — '+chantier.nom) : (f.devisId ? 'Depuis un devis' : 'Facture libre')}</div>
      <div class="devis-card-foot">
        <span>${fmtDate(f.date)}</span>
        <span class="devis-card-total">${fmtMontant(totals.totalTTC)} TTC</span>
      </div>
    </div>
  `;
}

function openFactureModal(mode, facture, fromDevis){
  let data;
  if(mode==='new' && fromDevis){
    data = {
      id: uid(), numero:'', devisId: fromDevis.id, chantierId: fromDevis.chantierId||'',
      client: fromDevis.client||'', adresseClient: fromDevis.adresseClient||'',
      date: toDateStr(new Date()), echeanceJours:30, tva: fromDevis.tva!=null?fromDevis.tva:20,
      lignes: JSON.parse(JSON.stringify(fromDevis.lignes||[])).map(l=>({...l, id:uid()})),
      statutPaiement:'a_payer', notes: fromDevis.notes||'',
    };
    if(data.lignes.length===0) data.lignes.push(newDevisLine());
  }else if(mode==='new'){
    data = {
      id: uid(), numero:'', devisId:'', chantierId:'', client:'', adresseClient:'',
      date: toDateStr(new Date()), echeanceJours:30, tva:20,
      lignes:[newDevisLine()], statutPaiement:'a_payer', notes:'',
    };
  }else{
    data = JSON.parse(JSON.stringify(facture));
  }
  factureModalState = {mode, data};
  renderFactureModal();
}

function closeFactureModal(){
  factureModalState = null;
  const old = document.querySelector('.overlay');
  if(old) old.remove();
}

function renderFactureModal(){
  let old = document.querySelector('.overlay');
  if(old) old.remove();
  const {mode, data} = factureModalState;
  const totals = computeFactureTotals(data);

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal devis-modal">
      <div class="modal-head">
        <h2>${mode==='new' ? 'Nouvelle facture' : (data.numero || 'Détail de la facture')}</h2>
        <button class="icon-btn" id="faClose">✕</button>
      </div>

      <label>Chantier associé (facultatif)</label>
      <select id="faChantier">
        <option value="">Aucun</option>
        ${chantiers.map(c=>`<option value="${c.id}" ${data.chantierId===c.id?'selected':''}>${escapeHtml(c.numero)} — ${escapeHtml(c.nom)}</option>`).join('')}
      </select>

      <label>Statut de paiement</label>
      <div class="status-picker" id="faStatutPaiement">
        ${PAIEMENT_STATUS.map(s=>`<div class="status-opt ${s.id==='payee'?'dsopt-accepte':'dsopt-refuse'} ${(data.statutPaiement||'a_payer')===s.id?'selected':''}" data-val="${s.id}">${s.label}</div>`).join('')}
      </div>

      <div class="row2">
        <div>
          <label>Client</label>
          <input type="text" id="faClient" value="${escapeHtml(data.client)}" placeholder="Nom du client" list="faClientList">
          ${clientsDatalistHtml('faClientList')}
        </div>
        <div>
          <label>Date d'émission</label>
          <input type="date" id="faDate" value="${data.date||''}">
        </div>
      </div>

      <label>Adresse du client</label>
      <textarea id="faAdresse" placeholder="Adresse postale du client">${escapeHtml(data.adresseClient||'')}</textarea>

      <div class="row2">
        <div>
          <label>Échéance de paiement (jours)</label>
          <input type="text" id="faEcheance" value="${data.echeanceJours||30}">
        </div>
        <div>
          <label>TVA (%)</label>
          <div class="devis-tva-input"><input type="text" id="faTva" value="${data.tva!=null?data.tva:20}"><span>%</span></div>
        </div>
      </div>

      <label>Lignes de prestation</label>
      <div class="devis-lines-table-wrap">
        <table class="devis-lines-table" id="faLinesTable">
          <thead><tr>
            <th style="width:40%">Désignation</th><th style="width:12%">Qté</th><th style="width:12%">Unité</th>
            <th style="width:16%">Prix unit. HT</th><th style="width:16%">Total HT</th><th></th>
          </tr></thead>
          <tbody id="faLinesBody">
            ${data.lignes.map(l=>devisLineRowHtml(l)).join('')}
          </tbody>
        </table>
      </div>
      <button type="button" class="btn-add-line" id="faAddLine">+ Ajouter une ligne</button>

      <div class="devis-totals" id="faTotals">
        <div class="devis-totals-row"><span>Total HT</span><span id="faTotalHT">${fmtMontant(totals.totalHT)}</span></div>
        <div class="devis-totals-row"><span>TVA</span><span id="faTotalTVA">${fmtMontant(totals.montantTva)}</span></div>
        <div class="devis-totals-row grand"><span>Total TTC</span><span id="faTotalTTC">${fmtMontant(totals.totalTTC)}</span></div>
      </div>

      <label>Notes / conditions</label>
      <textarea id="faNotes" placeholder="Conditions de paiement, coordonnées bancaires…">${escapeHtml(data.notes||'')}</textarea>

      <div class="modal-actions">
        ${mode==='edit' ? `<button class="btn-danger" id="faDelete">Supprimer</button>` : ''}
        <button class="btn-export" id="faPrint" style="flex:0;">🖨 Imprimer / PDF</button>
        <button class="btn-primary" id="faSave">${mode==='new' ? 'Créer la facture' : 'Enregistrer'}</button>
      </div>
      <div class="saving-note">Visible par Alexis et Yoann</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay) closeFactureModal(); };
  document.getElementById('faClose').onclick = closeFactureModal;

  document.getElementById('faChantier').onchange = (e) => {
    data.chantierId = e.target.value;
    if(data.chantierId){
      const c = chantiers.find(x=>x.id===data.chantierId);
      if(c && !data.client){ data.client = c.client; document.getElementById('faClient').value = c.client||''; }
    }
  };

  document.getElementById('faStatutPaiement').querySelectorAll('.status-opt').forEach(opt=>{
    opt.onclick = () => {
      document.getElementById('faStatutPaiement').querySelectorAll('.status-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      data.statutPaiement = opt.dataset.val;
    };
  });

  function recalcTotals(){
    const t = computeFactureTotals(data);
    document.getElementById('faTotalHT').textContent = fmtMontant(t.totalHT);
    document.getElementById('faTotalTVA').textContent = fmtMontant(t.montantTva);
    document.getElementById('faTotalTTC').textContent = fmtMontant(t.totalTTC);
  }

  function bindLineRow(row, line){
    const desInput = row.querySelector('.col-des input');
    const qteInput = row.querySelector('.col-qte input');
    const uniteInput = row.querySelector('.col-unite input');
    const prixInput = row.querySelector('.col-prix input');
    const totalSpan = row.querySelector('.devis-line-total');
    const rmBtn = row.querySelector('.devis-line-rm');

    desInput.oninput = () => { line.designation = desInput.value; };
    uniteInput.oninput = () => { line.unite = uniteInput.value; };
    qteInput.oninput = () => {
      line.quantite = parseFloat(qteInput.value.replace(',','.')) || 0;
      totalSpan.textContent = fmtMontant(line.quantite * line.prixUnitaire);
      recalcTotals();
    };
    prixInput.oninput = () => {
      line.prixUnitaire = parseFloat(prixInput.value.replace(',','.')) || 0;
      totalSpan.textContent = fmtMontant(line.quantite * line.prixUnitaire);
      recalcTotals();
    };
    rmBtn.onclick = () => {
      data.lignes = data.lignes.filter(l=>l.id!==line.id);
      row.remove();
      recalcTotals();
    };
  }

  document.querySelectorAll('#faLinesBody tr').forEach(row=>{
    const line = data.lignes.find(l=>l.id===row.dataset.id);
    if(line) bindLineRow(row, line);
  });

  document.getElementById('faTva').oninput = (e) => {
    data.tva = parseFloat(e.target.value.replace(',','.')) || 0;
    recalcTotals();
  };

  document.getElementById('faAddLine').onclick = () => {
    const line = newDevisLine();
    data.lignes.push(line);
    const tbody = document.getElementById('faLinesBody');
    tbody.insertAdjacentHTML('beforeend', devisLineRowHtml(line));
    const row = tbody.querySelector(`tr[data-id="${line.id}"]`);
    bindLineRow(row, line);
  };

  document.getElementById('faPrint').onclick = () => {
    data.client = document.getElementById('faClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('faAdresse').value.trim();
    data.date = document.getElementById('faDate').value;
    data.echeanceJours = document.getElementById('faEcheance').value;
    data.notes = document.getElementById('faNotes').value.trim();
    printFacture(data);
  };

  document.getElementById('faSave').onclick = async () => {
    data.client = document.getElementById('faClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('faAdresse').value.trim();
    data.date = document.getElementById('faDate').value;
    data.echeanceJours = document.getElementById('faEcheance').value;
    data.notes = document.getElementById('faNotes').value.trim();
    data.lignes = data.lignes.filter(l=>l.designation.trim()!=='' || l.quantite || l.prixUnitaire);

    if(mode==='new'){
      data.numero = await nextFactureNumero();
      data.createdAt = Date.now();
      facturesListData.unshift(data);
    }else{
      const idx = facturesListData.findIndex(f=>f.id===data.id);
      facturesListData[idx] = data;
    }
    await saveFacturesList();
    closeFactureModal();
    render();
  };

  if(mode==='edit'){
    document.getElementById('faDelete').onclick = async () => {
      if(!confirm('Supprimer cette facture ?')) return;
      facturesListData = facturesListData.filter(f=>f.id!==data.id);
      await saveFacturesList();
      closeFactureModal();
      render();
    };
  }
}

function printFacture(f){
  const totals = computeFactureTotals(f);
  const chantier = f.chantierId ? chantiers.find(c=>c.id===f.chantierId) : null;
  const missing = legalIncompleteWarning();
  const area = document.getElementById('devisPrintArea');
  area.innerHTML = `
    <div class="print-head">
      <div><img class="print-logo" src="${LOGO_DATA_URI}" alt="V&M Études"></div>
      <div style="text-align:right;">
        <p class="print-title">Facture ${escapeHtml(f.numero||'')}</p>
        <p class="print-meta">Émise le ${fmtDate(f.date)}${f.echeanceJours ? ` — paiement sous ${escapeHtml(String(f.echeanceJours))} jours` : ''}</p>
        ${chantier ? `<p class="print-meta">Chantier : ${escapeHtml(chantier.numero)} — ${escapeHtml(chantier.nom)}</p>` : ''}
      </div>
    </div>
    ${missing.length ? `<div class="print-legal-warning">⚠ Mentions légales incomplètes : ${missing.join(', ')} manquant(s) — à compléter dans les paramètres (⚙️) avant envoi officiel au client.</div>` : ''}
    <div class="print-parties">
      <div><strong>${escapeHtml(companySettings.raisonSociale||'V&M Études')}</strong>${'\n'}${escapeHtml(legalMentionsBlock())}</div>
      <div><strong>Client</strong>${'\n'}${escapeHtml(f.client||'')}${f.adresseClient ? '\n'+escapeHtml(f.adresseClient) : ''}</div>
    </div>
    <table class="print-table">
      <thead><tr><th>Désignation</th><th>Qté</th><th>Unité</th><th>Prix unit. HT</th><th>Total HT</th></tr></thead>
      <tbody>
        ${f.lignes.map(l=>`<tr>
          <td>${escapeHtml(l.designation)}</td><td>${l.quantite}</td><td>${escapeHtml(l.unite||'')}</td>
          <td>${fmtMontant(l.prixUnitaire)}</td><td>${fmtMontant((l.quantite||0)*(l.prixUnitaire||0))}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="print-totals">
      <div class="print-totals-row"><span>Total HT</span><span>${fmtMontant(totals.totalHT)}</span></div>
      <div class="print-totals-row"><span>TVA (${f.tva||0}%)</span><span>${fmtMontant(totals.montantTva)}</span></div>
      <div class="print-totals-row grand"><span>Total TTC</span><span>${fmtMontant(totals.totalTTC)}</span></div>
    </div>
    ${f.notes ? `<div class="print-notes"><strong>Notes / conditions</strong>\n${escapeHtml(f.notes)}</div>` : ''}
    <div class="print-legal-footer">
      Pénalités de retard : ${escapeHtml(companySettings.tauxPenalites||"3 fois le taux d'intérêt légal")}. Indemnité forfaitaire pour frais de recouvrement : 40 € (art. L441-10 du Code de commerce). Pas d'escompte pour paiement anticipé.
    </div>
  `;
  window.print();
}

function dashboardSectionHtml(){
  const actifs = chantiers.filter(c=>!c.archived);
  const enCours = actifs.filter(c=>c.statut==='en_cours').length;
  const aPlanifier = actifs.filter(c=>c.statut==='a_planifier').length;

  const caFacture = facturesListData.reduce((s,f)=> s + computeFactureTotals(f).totalTTC, 0);

  const caParClient = {};
  facturesListData.forEach(f=>{
    const key = f.clientId || ('nom:'+(f.client||'Client non renseigné'));
    const label = displayClientName(f) || 'Client non renseigné';
    if(!caParClient[key]) caParClient[key] = {label, total:0};
    caParClient[key].total += computeFactureTotals(f).totalTTC;
  });
  const topClients = Object.values(caParClient).sort((a,b)=>b.total-a.total).slice(0,5);
  const caPaye = facturesListData.filter(f=>(f.statutPaiement||'a_payer')==='payee')
    .reduce((s,f)=> s + computeFactureTotals(f).totalTTC, 0);
  const caEnAttente = caFacture - caPaye;
  const caDevisEnCours = devisListData.filter(d=>(d.statutDevis||'envoye')==='envoye')
    .reduce((s,d)=> s + computeDevisTotals(d).totalTTC, 0);

  const devisTermines = devisListData.filter(d=>['accepte','refuse'].includes(d.statutDevis||'envoye'));
  const devisAcceptes = devisTermines.filter(d=>d.statutDevis==='accepte').length;
  const tauxAcceptation = devisTermines.length ? Math.round(devisAcceptes/devisTermines.length*100) : null;

  const moisRecents = [];
  const refDate = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(refDate.getFullYear(), refDate.getMonth()-i, 1);
    moisRecents.push({key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: MOIS_FR[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2)});
  }
  const caParMois = moisRecents.map(m=>({
    label: m.label,
    total: facturesListData.filter(f=>(f.date||'').startsWith(m.key)).reduce((s,f)=>s+computeFactureTotals(f).totalTTC,0),
  }));
  const maxCaMois = Math.max(1, ...caParMois.map(m=>m.total));

  const parType = TYPES.map(t=>({
    label:t.label,
    n: actifs.filter(c=>c.type===t.id).length,
  }));
  const maxType = Math.max(1, ...parType.map(t=>t.n));

  const devisEnAttente = devisListData.filter(d=>(d.statutDevis||'envoye')==='envoye');
  const now = Date.now();
  const devisLongueAttente = devisEnAttente
    .map(d=>({...d, joursAttente: Math.floor((now-(d.createdAt||now))/86400000)}))
    .filter(d=>d.joursAttente>14)
    .sort((a,b)=>b.joursAttente-a.joursAttente);

  return `
    <p class="agenda-summary">Vue d'ensemble de l'activité</p>
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-label">Chantiers actifs</div>
        <div class="dash-card-value">${actifs.length}</div>
        <div class="dash-card-sub">${enCours} en cours · ${aPlanifier} à planifier</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">Devis en cours</div>
        <div class="dash-card-value">${fmtMontant(caDevisEnCours)}</div>
        <div class="dash-card-sub">${devisEnAttente.length} en attente de réponse</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">Facturé au total</div>
        <div class="dash-card-value">${fmtMontant(caFacture)}</div>
        <div class="dash-card-sub">${facturesListData.length} facture${facturesListData.length>1?'s':''}</div>
      </div>
      <div class="dash-card dash-card-accent">
        <div class="dash-card-label">En attente de paiement</div>
        <div class="dash-card-value">${fmtMontant(caEnAttente)}</div>
        <div class="dash-card-sub">${fmtMontant(caPaye)} déjà payé</div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">Taux d'acceptation des devis</div>
        <div class="dash-card-value">${tauxAcceptation!=null ? tauxAcceptation+'%' : '—'}</div>
        <div class="dash-card-sub">${devisTermines.length ? `${devisAcceptes} accepté${devisAcceptes>1?'s':''} sur ${devisTermines.length}` : 'Pas encore de devis conclu'}</div>
      </div>
    </div>

    <div class="dash-section">
      <h3>Chiffre d'affaires facturé (6 derniers mois)</h3>
      <div class="dash-bars">
        ${caParMois.map(m=>`
          <div class="dash-bar-row">
            <span class="dash-bar-label">${escapeHtml(m.label)}</span>
            <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${(m.total/maxCaMois*100)}%"></div></div>
            <span class="dash-bar-value" style="width:auto;min-width:70px;">${fmtMontant(m.total)}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="dash-section">
      <h3>Répartition des chantiers actifs par type</h3>
      <div class="dash-bars">
        ${parType.map(t=>`
          <div class="dash-bar-row">
            <span class="dash-bar-label">${escapeHtml(t.label)}</span>
            <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${(t.n/maxType*100)}%"></div></div>
            <span class="dash-bar-value">${t.n}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="dash-section">
      <h3>Top clients (chiffre d'affaires facturé)</h3>
      ${topClients.length===0 ? `<p class="dash-empty">Pas encore de facture pour établir un classement.</p>` : `
        <div class="dash-bars">
          ${topClients.map(c=>`
            <div class="dash-bar-row">
              <span class="dash-bar-label">${escapeHtml(c.label)}</span>
              <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${(c.total/topClients[0].total*100)}%"></div></div>
              <span class="dash-bar-value" style="width:auto;min-width:70px;">${fmtMontant(c.total)}</span>
            </div>
          `).join('')}
        </div>
      `}
    </div>

    <div class="dash-section">
      <h3>Devis sans réponse depuis plus de 14 jours</h3>
      ${devisLongueAttente.length===0 ? `<p class="dash-empty">Rien à signaler — tous les devis récents ont eu une réponse ou sont encore récents.</p>` : `
        <div class="dash-list">
          ${devisLongueAttente.map(d=>`
            <div class="dash-list-item" data-id="${d.id}">
              <span>${escapeHtml(d.numero)} — ${escapeHtml(d.client||'Client non renseigné')}</span>
              <span class="dash-list-days">${d.joursAttente} jours</span>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

function bindDashboardSectionEvents(){
  app.querySelectorAll('.dash-list-item').forEach(el=>{
    el.onclick = () => {
      appView = 'devis';
      render();
      const d = devisListData.find(x=>x.id===el.dataset.id);
      if(d) openDevisModal('edit', d);
    };
  });
}

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>Informations légales de l'entreprise</h2>
        <button class="icon-btn" id="stClose">✕</button>
      </div>
      <p class="sync-hint" style="margin-top:0;">Ces informations complètent automatiquement les mentions légales sur les factures imprimées. À remplir dès qu'elles seront disponibles (immatriculation prévue en 2027).</p>

      <label>Raison sociale</label>
      <input type="text" id="stRaison" value="${escapeHtml(s.raisonSociale)}">

      <div class="row2">

        </div>
      </div>

      <label>Adresse du siège social</label>
      <textarea id="stAdresse" placeholder="Adresse complète">${escapeHtml(s.adresseSiege)}</textarea>

      <label>Ville d'immatriculation RCS</label>
      <input type="text" id="stRcs" value="${escapeHtml(s.villeRcs)}" placeholder="Ex. Chalon-sur-Saône">

      <label>Régime de TVA</label>
      <div class="status-picker" id="stTvaRegime">
        <div class="status-opt tyopt-detection ${s.regimeTva==='assujetti'?'selected':''}" data-val="assujetti">Assujetti à la TVA</div>
        <div class="status-opt tyopt-amo ${s.regimeTva==='franchise'?'selected':''}" data-val="franchise">Franchise en base (TVA non applicable)</div>
        <div class="status-opt tyopt-topo ${s.regimeTva==='inconnu'?'selected':''}" data-val="inconnu">Pas encore déterminé</div>
      </div>

      <label>Numéro de TVA intracommunautaire (si assujetti)</label>
      <input type="text" id="stTvaNum" value="${escapeHtml(s.numeroTva)}" placeholder="FR XX XXXXXXXXX">

      <label>Taux des pénalités de retard (mention obligatoire entre professionnels)</label>
      <input type="text" id="stPenalites" value="${escapeHtml(s.tauxPenalites)}">

      <div class="modal-actions">
        <button class="btn-primary" id="stSave">Enregistrer</button>
      </div>
      <div class="saving-note">Visible par Alexis et Yoann</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay) closeSettingsModal(); };
  document.getElementById('stClose').onclick = closeSettingsModal;

  document.getElementById('stTvaRegime').querySelectorAll('.status-opt').forEach(opt=>{
    opt.onclick = () => {
      document.getElementById('stTvaRegime').querySelectorAll('.status-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');

  document.getElementById('stSave').onclick = async () => {
    companySettings = {
      raisonSociale: document.getElementById('stRaison').value.trim() || 'V&M Études',
      formeJuridique: document.getElementById('stForme').value.trim(),
      siret: document.getElementById('stSiret').value.trim(),
      adresseSiege: document.getElementById('stAdresse').value.trim(),

      regimeTva: s.regimeTva || 'inconnu',
      numeroTva: document.getElementById('stTvaNum').value.trim(),
      tauxPenalites: document.getElementById('stPenalites').value.trim(),
    };
    await saveCompanySettings();
    closeSettingsModal();
    render();
  };
}

function legalMentionsBlock(){
  const s = companySettings;
  const lines = [];
  if(s.formeJuridique) lines.push(s.formeJuridique);
  if(s.adresseSiege) lines.push(s.adresseSiege);
  const idBits = [];
  if(s.siret) idBits.push('SIRET ' + s.siret);
  if(s.villeRcs && s.formeJuridique && s.formeJuridique.toUpperCase()!=='AUTO-ENTREPRENEUR') idBits.push('RCS ' + s.villeRcs);
  if(idBits.length) lines.push(idBits.join(' — '));
  if(s.regimeTva==='franchise'){
    lines.push('TVA non applicable, art. 293 B du CGI');
  }else if(s.regimeTva==='assujetti' && s.numeroTva){
    lines.push('TVA intracommunautaire : ' + s.numeroTva);
  }
  if(lines.length===0) lines.push("Bureau d'études — topographie, détection, AMO");
  return lines.join('\n');
}

function legalIncompleteWarning(){
  const s = companySettings;
  const missing = [];
  if(!s.siret) missing.push('SIRET');
  if(!s.adresseSiege) missing.push('adresse du siège');
  if(s.regimeTva==='inconnu') missing.push('régime de TVA');
  return missing;
}
