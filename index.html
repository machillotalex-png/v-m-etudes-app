<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V&M Études — Suivi de chantiers</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2E6E62">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="V&M Études">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #EEF1EC;
    --surface: #FFFFFF;
    --surface-soft: #F5F7F3;
    --ink: #1E2A28;
    --ink-soft: #5B6B66;
    --ink-faint: #94A19C;
    --line: #2E6E62;
    --accent: #E24E93;
    --accent-soft: #FBE4EF;
    --st-planifier: #6B6F76;
    --st-planifier-soft: #E7E8EA;
    --st-cours: #2E6E62;
    --st-cours-soft: #E1EEE9;
    --st-attente: #B8790C;
    --st-attente-soft: #F7ECD8;
    --st-termine: #4C7A3D;
    --st-termine-soft: #E8EFE2;
    --dv-a_faire: #96582A;
    --dv-a_faire-soft: #F3E4D4;
    --dv-en_cours: #2E5F8A;
    --dv-en_cours-soft: #DFEAF4;
    --dv-fait: #4C7A3D;
    --dv-fait-soft: #E8EFE2;
    --rd-en_cours: #5A5FA6;
    --rd-en_cours-soft: #E6E6F3;
    --fa-a_facturer: #B8434A;
    --fa-a_facturer-soft: #F6DEDF;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(30,42,40,0.06), 0 4px 14px rgba(30,42,40,0.06);
  }

  html{color-scheme: light only;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(46,110,98,0.05) 0, transparent 45%),
      radial-gradient(circle at 90% 3%, rgba(226,78,147,0.045) 0, transparent 40%),
      repeating-radial-gradient(circle at 8% 4%, transparent 0, transparent 38px, rgba(46,110,98,0.05) 39px, transparent 40px);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{max-width:960px;margin:0 auto;padding:20px 16px 80px;}

  button,.tab,.status-opt,.card,.devis-card,input,select,textarea,.agenda-chip{
    transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .1s ease,box-shadow .15s ease;
  }
  button:focus-visible,.tab:focus-visible,.status-opt:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible,
  .card:focus-visible,.devis-card:focus-visible,.agenda-chip:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  button{-webkit-tap-highlight-color:transparent;}
  button:active{transform:scale(0.97);}
  .card:active,.devis-card:active{transform:scale(0.99);}

  /* Header */
  .header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:12px;margin-bottom:6px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{height:58px;width:auto;flex-shrink:0;}

  .header-actions{display:flex;gap:8px;align-items:flex-start;}
  .search-box{
    font-family:'Inter',sans-serif;font-size:0.84rem;padding:8px 12px;
    border:1px solid #D8DED8;border-radius:8px;background:var(--surface);color:var(--ink);
    min-width:180px;
  }
  .search-box:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .alerts-wrap{position:relative;}
  .alerts-bell{
    background:var(--surface);border:1px solid #D8DED8;border-radius:10px;
    width:42px;height:42px;font-size:1.15rem;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .alerts-badge{
    position:absolute;top:-4px;right:-4px;background:var(--fa-a_facturer);color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;
    min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
  .alerts-panel{
    position:fixed;top:78px;right:14px;left:14px;margin:0 auto;z-index:30;width:auto;max-width:320px;
    background:var(--surface);color:var(--ink);border:1px solid #D8DED8;border-radius:10px;box-shadow:var(--shadow);
    max-height:60vh;overflow-y:auto;
  }
  @media(min-width:600px){
    .alerts-panel{left:auto;}
  }
  .alerts-panel-head{
    color:var(--ink);
    padding:10px 12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.82rem;
    border-bottom:1px solid #ECEFEA;
  }
  .alerts-item{
    padding:9px 12px;border-bottom:1px solid #ECEFEA;cursor:pointer;font-size:0.78rem;
    display:flex;gap:8px;align-items:flex-start;
  }
  .alerts-item:last-child{border-bottom:none;}
  .alerts-item:hover{background:var(--surface-soft);}
  .alerts-item-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0;}
  .alerts-item-dot.retard{background:var(--fa-a_facturer);}
  .alerts-item-dot.bientot{background:var(--st-attente);}
  .alerts-item-dot.info{background:var(--line);}
  .alerts-item-text strong{display:block;font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);}
  .alerts-item-text span{color:var(--ink-faint);font-size:0.72rem;}
  .alerts-empty{padding:20px 12px;text-align:center;color:var(--ink-faint);font-size:0.78rem;}

  /* Dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 24px;}
  .dash-card{
    background:var(--surface);border-radius:var(--radius);padding:16px;
    box-shadow:0 1px 2px rgba(30,42,40,0.05), 0 2px 8px rgba(30,42,40,0.045);
    border:1px solid #ECEFEA;border-left:3px solid var(--line);
  }
  .dash-card-accent{border-left-color:var(--st-attente);}
  .dash-card-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.03em;}
  .dash-card-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;margin:6px 0 2px;color:var(--ink);}
  .dash-card-sub{font-size:0.76rem;color:var(--ink-soft);}

  .dash-section{margin-bottom:26px;}
  .dash-section h3{font-family:'Space Grotesk',sans-serif;font-size:0.92rem;margin:0 0 12px;}
  .dash-bars{display:flex;flex-direction:column;gap:10px;}
  .dash-bar-row{display:flex;align-items:center;gap:10px;}
  .dash-bar-label{width:110px;font-size:0.8rem;color:var(--ink-soft);flex-shrink:0;}
  .dash-bar-track{flex:1;height:10px;background:var(--surface-soft);border-radius:5px;overflow:hidden;}
  .dash-bar-fill{height:100%;background:var(--line);border-radius:5px;}
  .dash-bar-value{width:24px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--ink);}

  .dash-empty{color:var(--ink-faint);font-size:0.82rem;}
  .dash-list{display:flex;flex-direction:column;gap:1px;background:#ECEFEA;border-radius:8px;overflow:hidden;}
  .dash-list-item{
    background:var(--surface);padding:10px 12px;display:flex;justify-content:space-between;
    font-size:0.82rem;cursor:pointer;
  }
  .dash-list-item:hover{background:var(--surface-soft);}
  .dash-list-days{color:var(--fa-a_facturer);font-family:'JetBrains Mono',monospace;font-size:0.76rem;}

  /* Carte des chantiers */
  .chantiers-map{
    width:100%;height:440px;border-radius:var(--radius);overflow:hidden;
    border:1px solid #ECEFEA;box-shadow:0 1px 2px rgba(30,42,40,0.05), 0 2px 8px rgba(30,42,40,0.045);
  }
  .map-attribution{font-size:0.7rem;color:var(--ink-faint);margin:8px 0 0;}
  @media(max-width:600px){ .chantiers-map{height:320px;} }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.35rem;font-weight:700;margin:0;letter-spacing:-0.01em;
  }
  .brand p{margin:0;font-size:0.78rem;color:var(--ink-soft);}
  .local-mode-note{color:#B8790C !important;font-weight:500;margin-top:2px !important;}

  .chaining{
    height:14px;margin:16px 0 20px;
    background-image:repeating-linear-gradient(
      90deg, var(--line) 0, var(--line) 1.5px, transparent 1.5px, transparent 14px
    );
    background-position:bottom;background-repeat:repeat-x;background-size:auto 100%;
    opacity:0.55;
  }

  /* Toolbar */
  .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;padding:8px 12px;border-radius:999px;
    background:var(--surface);color:var(--ink-soft);border:1px solid #E1E5E0;
    cursor:pointer;transition:all .15s ease;
  }
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .load-error-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:#FBE4E4;color:#8A2A2A;border:1px solid #EFC0C0;border-radius:8px;
    padding:10px 12px;font-size:0.82rem;margin-bottom:16px;
  }
  .load-error-banner button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.78rem;
    background:#fff;color:#8A2A2A;border:1px solid #8A2A2A;border-radius:6px;
    padding:5px 10px;cursor:pointer;white-space:nowrap;
  }

  .main-nav-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:2px;}

  .nav-menu-wrap{position:relative;}
  .nav-menu-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.9rem;
    background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);
  }
  .nav-menu-caret{font-size:0.7rem;opacity:0.8;}
  .nav-menu-dropdown{
    position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:220px;
    background:var(--surface);border:1px solid #D8DED8;border-radius:10px;box-shadow:var(--shadow);
    flex-direction:column;overflow:hidden;
  }
  .nav-menu-item{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.85rem;color:var(--ink-soft);
    background:none;border:none;padding:11px 14px;text-align:left;cursor:pointer;
    display:flex;align-items:center;gap:10px;white-space:nowrap;
  }
  .nav-menu-item:hover{background:var(--surface-soft);}
  .nav-menu-item.active{background:var(--st-cours-soft);color:var(--line);}
  .nav-menu-item .tab-icon{font-size:0.95rem;}

  .sync-actions{display:flex;gap:8px;padding-bottom:10px;}
  .btn-sync{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.76rem;
    background:var(--surface);color:var(--ink-soft);border:1px solid #D8DED8;border-radius:8px;
    padding:6px 10px;cursor:pointer;white-space:nowrap;
  }
  .btn-sync:hover{border-color:var(--line);color:var(--line);}
  .btn-google{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-google:hover{color:#fff;border-color:var(--ink);opacity:0.9;}
  .google-status{
    font-family:'JetBrains Mono',monospace;font-size:0.74rem;color:var(--dv-fait);
    display:flex;align-items:center;padding:0 4px;
  }
  .sync-error{font-size:0.74rem;color:#B8434A;margin:0 0 10px;}
  .sync-hint{font-size:0.74rem;color:var(--ink-faint);margin:0 0 16px;}
  .app-footer-note{text-align:center;font-size:0.72rem;color:var(--ink-faint);margin:32px 0 8px;}

  .backup-menu-wrap{position:relative;}
  .backup-menu{
    position:fixed;top:78px;right:14px;left:14px;margin:0 auto;z-index:30;width:auto;max-width:200px;
    background:var(--surface);border:1px solid #D8DED8;border-radius:8px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;
  }
  @media(min-width:600px){
    .backup-menu{left:auto;}
  }
  .backup-menu button{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.78rem;color:var(--ink);
    background:none;border:none;padding:9px 12px;text-align:left;cursor:pointer;white-space:nowrap;
  }
  .backup-menu button:hover{background:var(--surface-soft);}
  .backup-menu button + button{border-top:1px solid #ECEFEA;}

  .toolbar-actions{display:flex;gap:8px;}
  .btn-export{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.85rem;
    background:var(--surface);color:var(--ink);border:1px solid #D8DED8;border-radius:8px;
    padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .btn-export:hover{border-color:var(--line);color:var(--line);}
  .btn-archive-toggle{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.85rem;
    background:var(--surface);color:var(--ink-soft);border:1px solid #D8DED8;border-radius:8px;
    padding:9px 14px;cursor:pointer;
  }
  .btn-archive-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-new{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:0.85rem;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer;
    box-shadow:0 1px 2px rgba(226,78,147,0.25), 0 4px 12px rgba(226,78,147,0.28);
    display:flex;align-items:center;gap:6px;
  }
  .btn-new:hover{filter:brightness(1.05);box-shadow:0 2px 4px rgba(226,78,147,0.3), 0 6px 16px rgba(226,78,147,0.32);transform:translateY(-1px);}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .empty{
    grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--ink-soft);
    background:var(--surface);border-radius:var(--radius);border:1px dashed #C9D0CA;
  }
  .empty-icon{margin:0 auto 12px;opacity:0.55;}
  .empty strong{display:block;color:var(--ink);font-family:'Space Grotesk',sans-serif;margin-bottom:4px;}

  .card{
    background:var(--surface);border-radius:var(--radius);padding:14px 14px 12px 16px;
    box-shadow:0 1px 2px rgba(30,42,40,0.05), 0 2px 8px rgba(30,42,40,0.045);
    cursor:pointer;position:relative;
    border:1px solid #ECEFEA;border-left:3px solid var(--st-planifier);
  }
  .card.card-st-a_planifier{border-left-color:var(--st-planifier);}
  .card.card-st-en_cours{border-left-color:var(--st-cours);}
  .card.card-st-en_attente{border-left-color:var(--st-attente);}
  .card.card-st-termine{border-left-color:var(--st-termine);}
  .card:hover{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent);box-shadow:0 2px 4px rgba(30,42,40,0.08), 0 8px 20px rgba(30,42,40,0.09);transform:translateY(-1px);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .waze-btn{
    background:#D6EFFF;color:#0B5FA5;border:none;border-radius:8px;width:34px;height:34px;flex-shrink:0;
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .waze-btn:hover{background:#BEE4FF;}
  .butoir-row{margin-top:6px;}
  .butoir-row .ech-chip{font-size:0.7rem;padding:4px 9px;}
  .weather-loading{font-size:0.78rem;color:var(--ink-faint);margin:10px 0;}
  .weather-chip{
    display:flex;align-items:center;gap:10px;background:var(--st-cours-soft);color:var(--line);
    border-radius:8px;padding:10px 12px;font-size:0.82rem;margin:10px 0;
  }
  .weather-icon{font-size:1.4rem;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1rem;margin:0 0 2px;}
  .card-numero{
    font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--line);
    background:var(--st-cours-soft);padding:1px 6px;border-radius:4px;font-size:0.78rem;margin-right:5px;
  }
  .card-client{font-size:0.8rem;color:var(--ink-soft);margin:0;}

  .flag{
    font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:500;
    padding:3px 8px 3px 9px;letter-spacing:0.02em;white-space:nowrap;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8px 50%);
    margin:0 0 8px -8px;display:inline-block;
  }
  .flag.st-a_planifier{background:var(--st-planifier-soft);color:var(--st-planifier);}
  .flag.st-en_cours{background:var(--st-cours-soft);color:var(--st-cours);}
  .flag.st-en_attente{background:var(--st-attente-soft);color:var(--st-attente);}
  .flag.st-termine{background:var(--st-termine-soft);color:var(--st-termine);}

  .progress-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .progress-track{flex:1;height:5px;border-radius:3px;background:var(--surface-soft);overflow:hidden;}
  .progress-fill{height:100%;background:var(--line);border-radius:3px;}
  .progress-pct{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-soft);min-width:28px;text-align:right;}

  .card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:0.72rem;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
  .meta-icons{display:flex;gap:10px;align-items:center;}
  .meta-icons span{display:flex;align-items:center;gap:3px;}

  .devis-chip{
    font-family:'JetBrains Mono',monospace;font-size:0.66rem;font-weight:500;
    padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;
    margin-top:8px;
  }
  .devis-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .devis-chip.dv-a_faire{background:var(--dv-a_faire-soft);color:var(--dv-a_faire);}
  .devis-chip.dv-en_cours{background:var(--dv-en_cours-soft);color:var(--dv-en_cours);}
  .devis-chip.dv-fait{background:var(--dv-fait-soft);color:var(--dv-fait);}
  .devis-chip.rd-a_faire{background:var(--st-planifier-soft);color:var(--st-planifier);}
  .devis-chip.rd-en_cours{background:var(--rd-en_cours-soft);color:var(--rd-en_cours);}
  .devis-chip.rd-fait{background:var(--dv-fait-soft);color:var(--dv-fait);}
  .devis-chip.fa-a_facturer{background:var(--fa-a_facturer-soft);color:var(--fa-a_facturer);}
  .devis-chip.fa-facture{background:var(--dv-en_cours-soft);color:var(--dv-en_cours);}
  .devis-chip.fa-paye{background:var(--dv-fait-soft);color:var(--dv-fait);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-row .devis-chip{margin-top:0;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,28,26,0.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:20px 18px 28px;
  }
  @media(min-width:640px){.modal{border-radius:14px;padding:24px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h2{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin:0;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:8px;display:flex;min-width:36px;min-height:36px;align-items:center;justify-content:center;}
  .icon-btn:hover{color:var(--ink);}

  label{display:block;font-size:0.72rem;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;text-transform:uppercase;letter-spacing:0.04em;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=date],input[type=time],textarea,select{
    width:100%;padding:11px 10px;border:1px solid #DCE1DC;border-radius:8px;
    font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);background:var(--surface-soft);
  }
  textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

<script>
// Storage adapter: uses Claude's persistent window.storage when available (e.g. when the
// file is opened from inside Claude — shared between Alexis & Yoann). When the file is
// downloaded and opened directly in a browser (double-click), window.storage does not
// exist, so we fall back to the browser's own localStorage. In that fallback mode, data
// stays on that computer/browser only — it is not shared between different people/machines.
const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const isLocalFallback = !hasCloudStorage;

const localStorageAdapter = {
  async get(key){
    try{
      const v = window.localStorage.getItem('vm-etudes:'+key);
      return v===null ? null : {value: v};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      window.localStorage.setItem('vm-etudes:'+key, value);
      return {value};
    }catch(e){ return null; }
  },
  async delete(key){
    try{
      window.localStorage.removeItem('vm-etudes:'+key);
      return {deleted:true};
    }catch(e){ return null; }
  }
};

const storageAPI = hasCloudStorage ? window.storage : localStorageAdapter;

const APP_VIEWS = [
  {id:'chantiers', icon:'📍', label:'Chantiers'},
  {id:'devis', icon:'📄', label:'Devis'},
  {id:'agenda', icon:'📅', label:'Agenda'},
  {id:'flotte', icon:'🚐', label:'Flotte'},
  {id:'clients', icon:'👤', label:'Clients'},
  {id:'factures', icon:'🧾', label:'Factures'},
  {id:'dashboard', icon:'📊', label:'Tableau de bord'},
];

// ---------- Google Drive sync ----------
// Real-time sharing between Alexis & Yoann: once connected, the whole app's
// data lives in one JSON file in Google Drive. Whoever connects first creates
// it; they then share that file (via Drive's own sharing) with the other
// person's Google account so both apps can find and update it.
const GOOGLE_CLIENT_ID = '516047078700-8mggacktu8kmnttp0riapkr6n5354ptl.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email';
const DRIVE_FILENAME = 'vm-etudes-data.json';

let googleTokenClient = null;
let googleAccessToken = null;
let googleDriveFileId = null;
let googleUserEmail = null;
let googleConnecting = false;
let googleLastSyncError = null;

function waitForGoogleLib(cb, tries=40){
  if(window.google && window.google.accounts && window.google.accounts.oauth2){ cb(); return; }
  if(tries<=0) return;
  setTimeout(()=>waitForGoogleLib(cb, tries-1), 250);
}

const GOOGLE_RECONNECT_FLAG = 'vm-etudes:google-was-connected';
let googleSilentAttempt = false;

function initGoogleClient(){
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    callback: async (resp) => {
      if(resp.error){
        if(!googleSilentAttempt){
          googleLastSyncError = "Connexion refusée ou annulée.";
        }
        googleSilentAttempt = false;
        googleConnecting = false;
        render();
        return;
      }
      googleAccessToken = resp.access_token;
      await connectToDriveAfterAuth();
    }
  });

  // If we were connected before the page reloaded, try to reconnect
  // automatically without showing the Google consent screen again.
  try{
    if(window.localStorage.getItem(GOOGLE_RECONNECT_FLAG)==='1'){
      googleSilentAttempt = true;
      googleConnecting = true;
      render();
      googleTokenClient.requestAccessToken({prompt:''});
    }
  }catch(e){}
}

function connectGoogle(){
  if(!googleTokenClient){
    alert("Le module Google n'a pas pu se charger. Vérifie ta connexion internet et réessaie dans quelques secondes.");
    return;
  }
  googleSilentAttempt = false;
  googleConnecting = true;
  googleLastSyncError = null;
  render();
  googleTokenClient.requestAccessToken({prompt:'consent'});
}

function disconnectGoogle(){
  if(googleAccessToken && window.google && google.accounts && google.accounts.oauth2){
    google.accounts.oauth2.revoke(googleAccessToken, ()=>{});
  }
  googleAccessToken = null;
  googleDriveFileId = null;
  googleUserEmail = null;
  try{ window.localStorage.removeItem(GOOGLE_RECONNECT_FLAG); }catch(e){}
  render();
}

async function driveApiFetch(url, options={}){
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers||{}), 'Authorization': 'Bearer ' + googleAccessToken },
  });
  if(!res.ok){
    let detail = '';
    try{
      const body = await res.clone().json();
      detail = (body && body.error && (body.error.message || body.error)) || '';
    }catch(e){
      try{ detail = await res.text(); }catch(e2){}
    }
    if(res.status===401){
      throw new Error(`Session Google expirée (401)${detail ? ' — ' + detail : ''}`);
    }
    throw new Error(`Erreur Google Drive (${res.status})${detail ? ' — ' + detail : ''}`);
  }
  return res;
}

async function fetchGoogleUserEmail(){
  try{
    const res = await driveApiFetch('https://www.googleapis.com/oauth2/v3/userinfo');
    const info = await res.json();
    googleUserEmail = info.email || null;
  }catch(e){ googleUserEmail = null; }
}

let localDataVersion = 0;

function buildSnapshot(){
  return {
    exportedAt: new Date().toISOString(),
    dataVersion: localDataVersion,
    chantiers, counters, devisListData, devisCounter, rdvListData, vehiculesListData,
    clientsListData, facturesListData, factureCounter, companySettings,
  };
}

function applySnapshot(snapshot){
  chantiers = snapshot.chantiers || [];
  counters = snapshot.counters || {topo:0, detection:0, amo:0};
  devisListData = snapshot.devisListData || [];
  devisCounter = snapshot.devisCounter || 0;
  rdvListData = snapshot.rdvListData || [];
  vehiculesListData = snapshot.vehiculesListData || [];
  clientsListData = snapshot.clientsListData || [];
  facturesListData = snapshot.facturesListData || [];
  factureCounter = snapshot.factureCounter || 0;
  if(snapshot.companySettings) companySettings = {...companySettings, ...snapshot.companySettings};
  if(snapshot.media) mediaCache = {...mediaCache, ...snapshot.media}; // backward-compat with older backups
  localDataVersion = typeof snapshot.dataVersion==='number' ? snapshot.dataVersion : localDataVersion;
}

async function driveFindFileByName(name){
  const q = encodeURIComponent(`name = '${name}' and trashed = false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);
  const data = await res.json();
  return (data.files && data.files.length>0) ? data.files[0].id : null;
}

async function driveCreateFile(name, initialContent){
  const metaRes = await driveApiFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, mimeType:'application/json'}),
  });
  const meta = await metaRes.json();
  await driveWriteContentTo(meta.id, initialContent);
  return meta.id;
}

async function driveWriteContentTo(fileId, obj){
  if(!fileId) return;
  await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(obj),
  });
}

async function driveReadContentFrom(fileId){
  if(!fileId) return null;
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}

async function findOrCreateDriveFile(){
  const existing = await driveFindFileByName(DRIVE_FILENAME);
  if(existing){ googleDriveFileId = existing; return; }
  googleDriveFileId = await driveCreateFile(DRIVE_FILENAME, buildSnapshot());
}

async function driveWriteContent(snapshot){
  return driveWriteContentTo(googleDriveFileId, snapshot);
}

async function driveReadContent(){
  return driveReadContentFrom(googleDriveFileId);
}

// ---- Per-chantier media, synced to their own small Drive file so that a
// routine save (renaming a chantier, adding a rendez-vous...) never has to
// re-upload every photo in the app. Only touched when photos/documents
// actually change (see saveMedia), and fetched lazily per chantier.
let driveMediaFileIds = {};

async function driveSyncMedia(chantierId, media){
  if(!googleAccessToken) return;
  try{
    const name = `vm-etudes-media-${chantierId}.json`;
    let fileId = driveMediaFileIds[chantierId];
    if(!fileId){
      fileId = await driveFindFileByName(name);
      if(!fileId) fileId = await driveCreateFile(name, media);
      driveMediaFileIds[chantierId] = fileId;
    }else{
      await driveWriteContentTo(fileId, media);
    }
  }catch(e){
    console.warn('Erreur de synchronisation des médias Drive pour', chantierId, e);
  }
}

async function driveFetchMedia(chantierId){
  if(!googleAccessToken) return null;
  try{
    const name = `vm-etudes-media-${chantierId}.json`;
    let fileId = driveMediaFileIds[chantierId];
    if(!fileId){
      fileId = await driveFindFileByName(name);
      if(!fileId) return null;
      driveMediaFileIds[chantierId] = fileId;
    }
    return await driveReadContentFrom(fileId);
  }catch(e){
    console.warn('Erreur de lecture des médias Drive pour', chantierId, e);
    return null;
  }
}

async function connectToDriveAfterAuth(){
  googleConnecting = true;
  render();
  try{
    if(!googleAccessToken){
      throw new Error("Aucun jeton d'accès reçu de Google.");
    }
    await findOrCreateDriveFile();
    const remote = await driveReadContent();
    if(remote && Array.isArray(remote.chantiers)){
      applySnapshot(remote);
    }else{
      localDataVersion = 0;
      await driveWriteContent(buildSnapshot());
    }
    googleLastSyncError = null;
    try{ window.localStorage.setItem(GOOGLE_RECONNECT_FLAG, '1'); }catch(e2){}
  }catch(e){
    console.error('Erreur de connexion Drive', e);
    if(!googleSilentAttempt) googleLastSyncError = e.message || String(e);
    googleAccessToken = null;
  }
  googleSilentAttempt = false;
  // Best-effort only: never let this affect the connection state above.
  await fetchGoogleUserEmail();
  googleConnecting = false;
  loading = false;
  render();
  // Photo/document counts load lazily per chantier, in parallel, same as at page load.
  chantiers.forEach(c => loadMedia(c.id).then(()=>render()));
}

async function syncToDriveIfConnected(){
  if(!googleAccessToken || !googleDriveFileId) return;
  try{
    const remote = await driveReadContent();
    const remoteVersion = remote && typeof remote.dataVersion==='number' ? remote.dataVersion : localDataVersion;
    const conflict = remoteVersion !== localDataVersion;
    localDataVersion = remoteVersion + 1;
    const snapshot = buildSnapshot();
    await driveWriteContent(snapshot);
    googleLastSyncError = conflict
      ? "Les données avaient été modifiées entre-temps (par Yoann ou un autre appareil). Ta dernière modification a bien été envoyée — vérifie qu'aucune info ne s'est croisée."
      : null;
  }catch(e){
    console.error('Erreur de synchronisation Drive', e);
    googleLastSyncError = e.message || String(e);
  }
}

async function safeStorageGet(key, attempts=3){
  let lastErr = null;
  for(let i=0;i<attempts;i++){
    try{
      const res = await storageAPI.get(key, true);
      return {value: res ? res.value : null};
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await new Promise(r=>setTimeout(r, 300*(i+1)));
    }
  }
  // After retries, treat as "no data yet" — this is also the normal case
  // for a brand-new key that was never written, so we must not block saving.
  if(lastErr) console.warn('Lecture de', key, 'vide ou indisponible après plusieurs essais', lastErr);
  return {value: null};
}

async function exportBackup(){
  // ensure media for every chantier is loaded before snapshotting
  for(const c of chantiers){ await loadMedia(c.id); }

  const media = {};
  chantiers.forEach(c=>{ media[c.id] = mediaCache[c.id] || {photos:[], documents:[]}; });

  const snapshot = {
    exportedAt: new Date().toISOString(),
    chantiers, counters, devisListData, devisCounter, rdvListData, vehiculesListData,
    clientsListData, facturesListData, factureCounter, companySettings, media,
  };

  const blob = new Blob([JSON.stringify(snapshot)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const today = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vm-etudes-sauvegarde-${today}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  try{ window.localStorage.setItem('vm-etudes:last-backup-export', Date.now().toString()); }catch(e){}
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let snapshot;
    try{
      snapshot = JSON.parse(reader.result);
    }catch(e){
      alert("Ce fichier n'est pas une sauvegarde valide.");
      return;
    }
    if(!snapshot || !Array.isArray(snapshot.chantiers)){
      alert("Ce fichier n'est pas une sauvegarde valide.");
      return;
    }
    const dateInfo = snapshot.exportedAt ? new Date(snapshot.exportedAt).toLocaleString('fr-FR') : 'inconnue';
    const ok = confirm(`Remplacer toutes les données actuelles par cette sauvegarde du ${dateInfo} ?\n\nCette action écrase les chantiers, devis et documents actuellement présents sur cet ordinateur.`);
    if(!ok) return;

    chantiers = snapshot.chantiers || [];
    counters = snapshot.counters || {topo:0, detection:0, amo:0};
    devisListData = snapshot.devisListData || [];
    devisCounter = snapshot.devisCounter || 0;
    rdvListData = snapshot.rdvListData || [];
    vehiculesListData = snapshot.vehiculesListData || [];
    clientsListData = snapshot.clientsListData || [];
    facturesListData = snapshot.facturesListData || [];
    factureCounter = snapshot.factureCounter || 0;
    if(snapshot.companySettings) companySettings = {...companySettings, ...snapshot.companySettings};
    mediaCache = snapshot.media || {};

    await saveList();
    await storageAPI.set(COUNTERS_KEY, JSON.stringify(counters), true);
    await saveDevisList();
    await storageAPI.set(DEVIS_COUNTER_KEY, JSON.stringify(devisCounter), true);
    await saveRdvList();
    await saveFlotteList();
    await saveClientsList();
    await saveFacturesList();
    await storageAPI.set(FACTURE_COUNTER_KEY, JSON.stringify(factureCounter), true);
    await saveCompanySettings();
    for(const id of Object.keys(mediaCache)){
      await storageAPI.set('chantier-media:'+id, JSON.stringify(mediaCache[id]), true);
    }

    render();
    alert('Import terminé.');
  };
  reader.readAsText(file);
}

function brandLogo(){
  return `<img class="brand-mark" src="${LOGO_DATA_URI}" alt="V&M Études">`;
}

function render(){
  const pool = chantiers.filter(c => viewMode==='archives' ? !!c.archived : !c.archived);
  const listByStatut = filterStatut==='tous' ? pool : pool.filter(c=>c.statut===filterStatut);
  const list = matchesSearchList(listByStatut, c=>[c.numero, c.nom, displayClientName(c), c.adresse]);
  const archivedCount = chantiers.filter(c=>c.archived).length;
  app.innerHTML = `
    <div class="header">
      <div class="brand">
        ${brandLogo()}
        <div>
          <p>Organisation générale</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="alerts-bell" id="btnExportAll" title="Exporter tout en Excel">⬇</button>
        <div class="alerts-wrap backup-menu-wrap">
          <button class="alerts-bell" id="btnBackupMenu" title="Sauvegarde manuelle">💾</button>
          <div class="backup-menu" id="backupMenu" style="display:${backupMenuOpen?'flex':'none'};">
            <button id="btnBackupExport">💾 Exporter</button>
            <button id="btnBackupImport">📥 Importer</button>
          </div>
        </div>
        <button class="alerts-bell" id="btnSettings" title="Informations légales de l'entreprise">⚙️</button>
        <div class="alerts-wrap">
          <button class="alerts-bell" id="btnAlerts">🔔${(()=>{const n=computeAlerts().length; return n>0?`<span class="alerts-badge">${n}</span>`:'';})()}</button>
          ${alertsOpen ? alertsPanelHtml() : ''}
        </div>
      </div>
    </div>
    <div class="chaining"></div>

    <div class="main-nav-row">
      <div class="nav-menu-wrap">
        <button class="nav-menu-btn" id="navMenuBtn">
          <span class="tab-icon">${(APP_VIEWS.find(v=>v.id===appView)||APP_VIEWS[0]).icon}</span>
          ${(APP_VIEWS.find(v=>v.id===appView)||APP_VIEWS[0]).label}
          <span class="nav-menu-caret">▾</span>
        </button>
        <div class="nav-menu-dropdown" id="navMenuDropdown" style="display:${navMenuOpen?'flex':'none'};">
          ${APP_VIEWS.map(v=>`
            <button class="nav-menu-item ${appView===v.id?'active':''}" data-view="${v.id}">
              <span class="tab-icon">${v.icon}</span>${v.label}
            </button>
          `).join('')}
        </div>
      </div>
      <div class="sync-actions">
        ${googleAccessToken ? `
          <span class="google-status">🟢 ${googleUserEmail ? escapeHtml(googleUserEmail) : 'Connecté'}</span>
          <button class="btn-sync" id="btnGoogleDisconnect">Déconnecter</button>
        ` : `
          <button class="btn-sync btn-google" id="btnGoogleConnect">${googleConnecting ? 'Connexion…' : '🔗 Se connecter avec Google'}</button>
        `}
        <input type="file" id="backupFileInput" accept=".json" style="display:none">
      </div>
    </div>
    ${googleLastSyncError ? `<p class="sync-error">⚠ ${escapeHtml(googleLastSyncError)}</p>` : ''}

    ${appView==='devis' ? devisSectionHtml() : appView==='agenda' ? agendaSectionHtml() : appView==='flotte' ? flotteSectionHtml() :
      appView==='clients' ? clientsSectionHtml() : appView==='factures' ? facturesSectionHtml() : appView==='dashboard' ? dashboardSectionHtml() : `
    <div class="toolbar">
      <div class="tabs">
        <div class="tab ${filterStatut==='tous'?'active':''}" data-filter="tous">TOUS · ${pool.length}</div>
        ${STATUTS.map(s=>{
          const n = pool.filter(c=>c.statut===s.id).length;
          return `<div class="tab ${filterStatut===s.id?'active':''}" data-filter="${s.id}">${s.label.toUpperCase()} · ${n}</div>`;
        }).join('')}
      </div>
      <div class="toolbar-actions">
        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Rechercher un chantier…" value="${escapeHtml(searchQuery)}">
        <button class="btn-archive-toggle ${chantiersViewMode==='carte'?'active':''}" id="btnToggleCarte">🗺 ${chantiersViewMode==='carte'?'Vue liste':'Vue carte'}</button>
        <button class="btn-archive-toggle ${viewMode==='archives'?'active':''}" id="btnToggleArchive">🗄 Archives · ${archivedCount}</button>
        <button class="btn-new" id="btnNew">+ Nouveau chantier</button>
      </div>
    </div>

    ${viewMode==='archives' ? `<div class="archive-banner" style="background:var(--surface-soft);color:var(--ink-soft);">Chantiers archivés automatiquement une fois la facturation passée à « Payé ».</div>` : ''}

    ${chantiersViewMode==='carte' ? `
    <div id="chantiersMap" class="chantiers-map"></div>

        list.map(c=>cardHtml(c)).join('')
      }
    </div>
    `}
    `}
    <p class="app-footer-note">${googleAccessToken ? '🟢 Synchronisé via Google Drive' : ''}</p>
  `;

  function goTo(view){ appView = view; searchQuery = ''; navMenuOpen = false; render(); }

    e.stopPropagation();
    navMenuOpen = !navMenuOpen;
    render();
  };
  if(navMenuOpen){
    document.addEventListener('click', ()=>{ navMenuOpen=false; render(); }, {once:true});

async function geocodeAddress(address){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!res.ok) return null;
    const data = await res.json();
    if(data && data[0]) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
  }catch(e){ console.warn('Géocodage échoué pour', address, e); }
  return null;
}

const WMO_ICONS = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  56:'🌧️',57:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',
  71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️',
};

function pickWeatherDate(data){
  const todayStr = toDateStr(new Date());
  const maxStr = toDateStr(new Date(Date.now()+15*86400000));
  const candidates = [data.dateDebut, data.dateFin].filter(d=>d && d>=todayStr && d<=maxStr);
  return candidates.sort()[0] || null;
}

async function loadWeatherWidget(data){
  const el = document.getElementById('weatherWidget');
  if(!el) return;
  const dateStr = pickWeatherDate(data);
  if(!data.adresse || !dateStr){ el.innerHTML = ''; return; }

  el.innerHTML = `<p class="weather-loading">Météo en cours de chargement…</p>`;
  try{
    let coords = (data.lat!=null && data.lng!=null) ? {lat:data.lat, lng:data.lng} : await geocodeAddress(data.adresse);
    if(!coords){ el.innerHTML = ''; return; }
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&start_date=${dateStr}&end_date=${dateStr}`;
    const res = await fetch(url);
    if(!res.ok){ el.innerHTML = ''; return; }
    const json = await res.json();
    if(!json.daily || !json.daily.time || !json.daily.time.length){ el.innerHTML = ''; return; }
    const icon = WMO_ICONS[json.daily.weathercode[0]] || '🌡️';
    const tmax = Math.round(json.daily.temperature_2m_max[0]);
    const tmin = Math.round(json.daily.temperature_2m_min[0]);
    const pluie = json.daily.precipitation_probability_max[0];
    const label = dateStr===data.dateDebut ? 'Météo prévue au début du chantier' : 'Météo prévue à la fin du chantier';
    if(document.getElementById('weatherWidget')){
      document.getElementById('weatherWidget').innerHTML = `
        <div class="weather-chip">
          <span class="weather-icon">${icon}</span>
          <span>${label} (${fmtDate(dateStr)}) : <strong>${tmin}° / ${tmax}°</strong> · ${pluie}% de pluie</span>
        </div>
      `;
    }
  }catch(e){
    console.warn('Erreur météo', e);
    if(document.getElementById('weatherWidget')) document.getElementById('weatherWidget').innerHTML = '';
  }
}

async function initChantiersMap(list){
  if(!window.L){
    const statusEl = document.getElementById('mapStatus');
    if(statusEl) statusEl.textContent = "La carte n'a pas pu se charger. Vérifie ta connexion.";
    return;
  }
  const mapEl = document.getElementById('chantiersMap');
  if(!mapEl) return;

  if(leafletMap){ leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map('chantiersMap').setView([46.5, 4.5], 6); // France, vue par défaut
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
  }).addTo(leafletMap);

  const withAddress = list.filter(c=>c.adresse && c.adresse.trim());
  const statusEl = document.getElementById('mapStatus');
  const bounds = [];

  withAddress.forEach(c=>{
    if(c.lat!=null && c.lng!=null){
      const marker = L.marker([c.lat, c.lng]).addTo(leafletMap);
      marker.bindPopup(`<strong>${escapeHtml(c.numero||'')}</strong><br>${escapeHtml(c.nom)}<br><span style="color:#5B6B66">${escapeHtml(c.client||'')}</span>`);
      marker.on('click', ()=> openModal('edit', c));
      bounds.push([c.lat, c.lng]);
    }
  });
  if(bounds.length>0) leafletMap.fitBounds(bounds, {padding:[30,30]});

  const toGeocode = withAddress.filter(c=>c.lat==null || c.lng==null);
  if(toGeocode.length===0){
    if(statusEl) statusEl.textContent = withAddress.length===0 ? "Aucun chantier avec adresse à afficher." : '';
    return;
  }

  if(statusEl) statusEl.textContent = `Localisation de ${toGeocode.length} adresse${toGeocode.length>1?'s':''}…`;

  for(const c of toGeocode){
    // still in map mode? (user may have switched away)
    if(chantiersViewMode!=='carte' || !document.getElementById('chantiersMap')) return;
    const coords = await geocodeAddress(c.adresse);
    if(coords){
      c.lat = coords.lat; c.lng = coords.lng;
      const idx = chantiers.findIndex(x=>x.id===c.id);
      if(idx>-1){ chantiers[idx].lat = coords.lat; chantiers[idx].lng = coords.lng; }
      if(leafletMap){
        const marker = L.marker([coords.lat, coords.lng]).addTo(leafletMap);
        marker.bindPopup(`<strong>${escapeHtml(c.numero||'')}</strong><br>${escapeHtml(c.nom)}<br><span style="color:#5B6B66">${escapeHtml(c.client||'')}</span>`);
        marker.on('click', ()=> openModal('edit', c));
        bounds.push([coords.lat, coords.lng]);
        leafletMap.fitBounds(bounds, {padding:[30,30]});
      }
    }
    await new Promise(r=>setTimeout(r, 1100)); // respecte la limite Nominatim (1 req/s)
  }
  await saveList();
  const statusEl2 = document.getElementById('mapStatus');
  if(statusEl2) statusEl2.textContent = '';
}

const MOIS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS_FR = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

function toDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function agendaSectionHtml(){
  const year = agendaDate.getFullYear();
  const month = agendaDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

  const cells = [];
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startWeekday + 1;
    const cellDate = new Date(year, month, dayNum);
    const inMonth = dayNum>=1 && dayNum<=daysInMonth;
    const dateStr = toDateStr(cellDate);
    const isToday = toDateStr(new Date())===dateStr;

    const starting = chantiers.filter(c=>!c.archived && c.dateDebut===dateStr);
    const ending = chantiers.filter(c=>!c.archived && c.dateFin===dateStr && c.dateFin!==c.dateDebut);
    const ongoing = chantiers.filter(c=>!c.archived && c.dateDebut && c.dateFin && c.dateDebut < dateStr && dateStr < c.dateFin);
    const rdvs = rdvListData.filter(r=>r.date===dateStr).sort((a,b)=>(a.heure||'').localeCompare(b.heure||''));

    const chips = [
      ...rdvs.map(r=>rdvChipHtml(r)),
      ...starting.map(c=>chipHtml(c,'▶')),
      ...ending.map(c=>chipHtml(c,'■')),
      ...ongoing.slice(0, Math.max(0,3-starting.length-ending.length)).map(c=>chipHtml(c,'·')),
    ].slice(0,4);
    const totalCount = rdvs.length + starting.length + ending.length + ongoing.length;
    const extra = totalCount - chips.length;

    cells.push(`
      <div class="agenda-cell ${inMonth?'':'agenda-cell-out'} ${isToday?'agenda-cell-today':''}">
        <div class="agenda-cell-head">
          <div class="agenda-daynum">${dayNum>=1 && dayNum<=daysInMonth ? dayNum : ''}</div>
          ${inMonth ? `<button class="agenda-add-btn" data-date="${dateStr}" title="Ajouter un rendez-vous">+</button>` : ''}
        </div>
        <div class="agenda-chips">
          ${chips.join('')}
          ${extra>0 ? `<div class="agenda-more">+${extra}</div>` : ''}
        </div>
      </div>
    `);
  }

  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const rdvCountMonth = rdvListData.filter(r=>r.date && r.date.startsWith(monthPrefix)).length;
  const chantierEventsMonth = chantiers.filter(c=>!c.archived && ((c.dateDebut||'').startsWith(monthPrefix) || (c.dateFin||'').startsWith(monthPrefix))).length;

  return `
    <div class="agenda-section">
      <div class="agenda-head">
        <p class="agenda-summary">${rdvCountMonth} rendez-vous · ${chantierEventsMonth} échéance${chantierEventsMonth>1?'s':''} de chantier ce mois-ci</p>
        <div class="agenda-head-right">
          <div class="agenda-nav">
            <button class="icon-btn" id="agendaPrev">‹</button>
            <span class="agenda-month">${MOIS_FR[month]} ${year}</span>
            <button class="icon-btn" id="agendaNext">›</button>
            <button class="agenda-today-btn" id="agendaToday">Aujourd'hui</button>
          </div>
          <button class="btn-new" id="btnNewRdv">+ Nouveau RDV</button>
        </div>
      </div>
      <div class="agenda-grid">
        ${JOURS_FR.map(j=>`<div class="agenda-dayname">${j}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="agenda-legend">
        <span>▶ début chantier</span><span>■ fin chantier</span><span>· en cours</span><span>🕐 rendez-vous</span>
      </div>
    </div>
  `;
}

function openRdvModal(mode, dateStr, rdv){
  const data = mode==='new' ? {
    id: uid(), titre:'', date: dateStr || toDateStr(new Date()), heure:'', chantierId:'', notes:''
  } : JSON.parse(JSON.stringify(rdv));
  rdvModalState = {mode, data};
  renderRdvModal();
}

function closeRdvModal(){
  rdvModalState = null;
  const old = document.querySelector('.overlay');
  if(old) old.remove();
}

function renderRdvModal(){
  let old = document.querySelector('.overlay');
  if(old) old.remove();
  const {mode, data} = rdvModalState;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>${mode==='new' ? 'Nouveau rendez-vous' : 'Détail du rendez-vous'}</h2>
        <button class="icon-btn" id="rClose">✕</button>
      </div>

      <label>Titre</label>
      <input type="text" id="rTitre" value="${escapeHtml(data.titre)}" placeholder="Ex. RDV client, visite de site…">

      <div class="row2">
        <div>
          <label>Date</label>
          <input type="date" id="rDate" value="${data.date||''}">
        </div>
        <div>
          <label>Heure (facultatif)</label>
          <input type="time" id="rHeure" value="${data.heure||''}">
        </div>
      </div>

      <label>Chantier associé (facultatif)</label>
      <select id="rChantier">
        <option value="">Aucun</option>
        ${chantiers.map(c=>`<option value="${c.id}" ${data.chantierId===c.id?'selected':''}>${escapeHtml(c.numero)} — ${escapeHtml(c.nom)}</option>`).join('')}
      </select>

      <label>Notes</label>
      <textarea id="rNotes" placeholder="Précisions, lieu, contact…">${escapeHtml(data.notes||'')}</textarea>

      <div class="modal-actions">
        ${mode==='edit' ? `<button class="btn-danger" id="rDelete">Supprimer</button>` : ''}
        <button class="btn-primary" id="rSave">${mode==='new' ? 'Créer le rendez-vous' : 'Enregistrer'}</button>
      </div>
      <div class="saving-note">Visible par Alexis et Yoann</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay) closeRdvModal(); };
  document.getElementById('rClose').onclick = closeRdvModal;

  document.getElementById('rSave').onclick = async () => {
    data.titre = document.getElementById('rTitre').value.trim() || 'Rendez-vous';
    data.date = document.getElementById('rDate').value;
    data.heure = document.getElementById('rHeure').value;
    data.chantierId = document.getElementById('rChantier').value;
    data.notes = document.getElementById('rNotes').value.trim();

    if(!data.date){
      alert('Merci de renseigner une date.');
      return;
    }

    if(mode==='new'){
      rdvListData.unshift(data);
    }else{
      const idx = rdvListData.findIndex(r=>r.id===data.id);
      rdvListData[idx] = data;
    }
    await saveRdvList();
    closeRdvModal();
    render();
  };

  if(mode==='edit'){
    document.getElementById('rDelete').onclick = async () => {
      if(!confirm('Supprimer ce rendez-vous ?')) return;
      rdvListData = rdvListData.filter(r=>r.id!==data.id);
      await saveRdvList();
      closeRdvModal();
      render();
    };
  }
}

function computeAlerts(){
  const alerts = [];
  const todayStr = toDateStr(new Date());
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = toDateStr(tomorrow);

  try{
    const last = parseInt(window.localStorage.getItem('vm-etudes:last-backup-export')||'0', 10);
    const daysSince = last ? Math.floor((Date.now()-last)/86400000) : Infinity;
    if(daysSince>14){
      alerts.push({dot:'bientot', view:'backup', id:'backup', title:'Sauvegarde manuelle recommandée', subtitle: last? `Dernier export il y a ${daysSince} jours` : 'Aucun export effectué pour le moment'});
    }
  }catch(e){}

  vehiculesListData.forEach(v=>{
    const sCT = echeanceStatus(v.dateControleTechnique);
    if(sCT==='retard' || sCT==='bientot'){
      alerts.push({dot:sCT, view:'flotte', id:v.id, title:`${v.nom} — contrôle technique`, subtitle: sCT==='retard'?'Dépassé':'Bientôt'});
    }
    const sRev = echeanceStatus(v.dateRevision);
    if(sRev==='retard' || sRev==='bientot'){
      alerts.push({dot:sRev, view:'flotte', id:v.id, title:`${v.nom} — révision`, subtitle: sRev==='retard'?'Dépassée':'Bientôt'});
    }
  });

  const now = Date.now();
  devisListData.forEach(d=>{
    if((d.statutDevis||'envoye')==='envoye'){
      const days = Math.floor((now-(d.createdAt||now))/86400000);
      if(days>14){
        alerts.push({dot:'bientot', view:'devis', id:d.id, title:`Devis ${d.numero} sans réponse`, subtitle:`Envoyé il y a ${days} jours`});
      }
    }
  });

  rdvListData.forEach(r=>{
    if(r.date===todayStr){
      alerts.push({dot:'info', view:'agenda', id:r.id, title:r.titre, subtitle:`Aujourd'hui${r.heure?' à '+r.heure:''}`});
    }else if(r.date===tomorrowStr){
      alerts.push({dot:'info', view:'agenda', id:r.id, title:r.titre, subtitle:`Demain${r.heure?' à '+r.heure:''}`});
    }
  });

  return alerts;
}

function alertsPanelHtml(){

function normSearch(s){ return (s||'').toString().toLowerCase(); }

function matchesSearchList(items, fieldsFn){
  const q = normSearch(searchQuery).trim();
  if(!q) return items;
  return items.filter(item => fieldsFn(item).some(f=>normSearch(f).includes(q)));
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function styleHeaderRow(sheet){
  const headerRow = sheet.getRow(1);
  headerRow.height = 22;
  headerRow.eachCell(cell=>{
    cell.font = {bold:true, color:{argb:'FFFFFFFF'}, size:11};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF2E6E62'}};
    cell.alignment = {vertical:'middle', horizontal:'left'};
  });
  sheet.views = [{state:'frozen', ySplit:1}];
  sheet.autoFilter = {from:{row:1, column:1}, to:{row:1, column:sheet.columns.length}};
  sheet.eachRow((row, rowNumber)=>{
    if(rowNumber===1) return;
    row.eachCell(cell=>{
      cell.border = {bottom:{style:'thin', color:{argb:'FFE1E5E0'}}};
    });
  });
}

        statut: i===0 ? paiementLabel(f.statutPaiement||'a_payer') : '',
        designation: l.designation||'',
        qte: l.quantite||'',
        unite: l.unite||'',
        prix: l.prixUnitaire||'',
        totalLigne: (l.quantite && l.prixUnitaire) ? (Number(l.quantite)*Number(l.prixUnitaire)) : '',
        tva: i===0 ? (f.tva!=null?f.tva:'') : '',
        totalHT: i===0 ? totals.totalHT : '',
        totalTTC: i===0 ? totals.totalTTC : '',
      });
    });
  });
  styleHeaderRow(facturesSheet);

  // -- Feuille Clients --
  const clientsSheet = wb.addWorksheet('Clients');
  clientsSheet.columns = [
    {header:'Nom', key:'nom', width:24},
    {header:'Contact', key:'contact', width:18},
    {header:'Téléphone', key:'tel', width:14},
    {header:'Email', key:'email', width:22},
    {header:'Adresse', key:'adresse', width:28},
    {header:'Notes', key:'notes', width:32},
  ];
  clientsListData.forEach(c=>{
    clientsSheet.addRow({
      nom: c.nom||'', contact: c.contact||'', tel: c.telephone||'', email: c.email||'',
      adresse: c.adresse||'', notes: c.notes||'',
    });
  });
  styleHeaderRow(clientsSheet);

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const today = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chantiers-vm-etudes-${today}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- Devis ----------

const DEVIS_STATUS = [
  {id:'envoye', label:'Envoyé'},
  {id:'accepte', label:'Accepté'},
  {id:'refuse', label:'Refusé'},
];
const devisStatusLabel = id => (DEVIS_STATUS.find(s=>s.id===id)||{}).label || 'Envoyé';

function displayClientName(entity){
  if(entity.clientId){
    const c = clientsListData.find(x=>x.id===entity.clientId);
    if(c) return c.nom;
  }
  return entity.client || '';
}

function resolveClientId(name){
  if(!name) return '';
  const n = name.trim().toLowerCase();
  const found = clientsListData.find(c=>(c.nom||'').trim().toLowerCase()===n);
  return found ? found.id : '';
}

function newDevisLine(){
  return {id: uid(), designation:'', quantite:1, unite:'u', prixUnitaire:0};
}

function computeDevisTotals(devis){
  const totalHT = (devis.lignes||[]).reduce((sum, l)=> sum + (Number(l.quantite)||0) * (Number(l.prixUnitaire)||0), 0);
  const tauxTva = Number(devis.tva)||0;
  const montantTva = totalHT * (tauxTva/100);
  const totalTTC = totalHT + montantTva;
  return {totalHT, montantTva, totalTTC};
}

function fmtMontant(n){
  return (n||0).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function devisSectionHtml(){
  const totalTTC = devisListData.reduce((sum,d)=> sum + computeDevisTotals(d).totalTTC, 0);
  const filtered = matchesSearchList(devisListData, d=>[d.numero, displayClientName(d)]);
  return `
    <div class="devis-toolbar">
      <p class="agenda-summary">${devisListData.length} devis · ${fmtMontant(totalTTC)} TTC au total</p>
      <input type="text" id="searchBox" class="search-box" placeholder="🔍 Rechercher un devis…" value="${escapeHtml(searchQuery)}">
      <button class="btn-new" id="btnNewDevis">+ Nouveau devis</button>
    </div>
    <div class="devis-grid">
      ${filtered.length===0 ? `<div class="empty">${emptyIconSvg()}<strong>${searchQuery?'Aucun résultat':'Aucun devis'}</strong>${searchQuery?'Essaie un autre terme de recherche.':'Crée ton premier devis, lié ou non à un chantier.'}</div>` :
        filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(d=>devisCardHtml(d)).join('')
      }
    </div>
  `;
}

function devisCardHtml(d){
  const totals = computeDevisTotals(d);
  const chantier = d.chantierId ? chantiers.find(c=>c.id===d.chantierId) : null;
  const st = d.statutDevis || 'envoye';
  return `
    <div class="devis-card devis-card-${st}" data-id="${d.id}">
      <div class="devis-card-top-row">
        <div class="devis-card-numero">${escapeHtml(d.numero||'')}</div>
        <span class="devis-status-chip ds-${st}">${devisStatusLabel(st)}</span>
      </div>
      <div class="devis-card-client">${escapeHtml(displayClientName(d)||'Client non renseigné')}</div>
      <div class="devis-card-chantier">${chantier ? escapeHtml(chantier.numero+' — '+chantier.nom) : 'Devis libre (sans chantier)'}</div>
      <div class="devis-card-foot">
        <span>${fmtDate(d.date)}</span>
        <span class="devis-card-total">${fmtMontant(totals.totalTTC)} TTC</span>
      </div>
    </div>
  `;
}

function bindSearchBox(){
  const searchBox = document.getElementById('searchBox');
  if(!searchBox) return;
  searchBox.oninput = (e) => {
    searchQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const nb = document.getElementById('searchBox');
    if(nb){ nb.focus(); nb.setSelectionRange(pos, pos); }
  };
}

function bindDevisSectionEvents(){
  bindSearchBox();
  const btnNew = document.getElementById('btnNewDevis');
  if(btnNew) btnNew.onclick = () => openDevisModal('new');
  app.querySelectorAll('.devis-card').forEach(el=>{
    el.onclick = () => openDevisModal('edit', devisListData.find(d=>d.id===el.dataset.id));
  });
}

function openDevisModal(mode, devis, prefill){
  let data;
  if(mode==='new'){
    data = {
      id: uid(), numero:'', chantierId:'', client:'', adresseClient:'',
      date: toDateStr(new Date()), validiteJours:30, tva:20, statutDevis:'envoye',
      lignes:[newDevisLine()], notes:'',
      ...(prefill||{}),
    };
    data.id = uid();
    data.numero = '';
    data.createdAt = undefined;
    data.statutDevis = 'envoye';
    data.lignes = (prefill && prefill.lignes && prefill.lignes.length)
      ? JSON.parse(JSON.stringify(prefill.lignes)).map(l=>({...l, id:uid()}))
      : [newDevisLine()];
  }else{
    data = JSON.parse(JSON.stringify(devis));
  }
  devisModalState = {mode, data};
  renderDevisModal();
}

function closeDevisModal(){
  devisModalState = null;
  const old = document.querySelector('.overlay');
  if(old) old.remove();
}

function renderDevisModal(){
  let old = document.querySelector('.overlay');
  if(old) old.remove();
  const {mode, data} = devisModalState;
  const totals = computeDevisTotals(data);

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal devis-modal">
      <div class="modal-head">
        <h2>${mode==='new' ? 'Nouveau devis' : (data.numero || 'Détail du devis')}</h2>
        <button class="icon-btn" id="dClose">✕</button>
      </div>

      <label>Chantier associé (facultatif)</label>
      <select id="dChantier">
        <option value="">Aucun — devis libre</option>
        ${chantiers.map(c=>`<option value="${c.id}" ${data.chantierId===c.id?'selected':''}>${escapeHtml(c.numero)} — ${escapeHtml(c.nom)}</option>`).join('')}
      </select>

      <label>Statut du devis</label>
      <div class="status-picker" id="dStatutDevis">
        ${DEVIS_STATUS.map(s=>`<div class="status-opt dsopt-${s.id} ${(data.statutDevis||'envoye')===s.id?'selected':''}" data-val="${s.id}">${s.label}</div>`).join('')}
      </div>

      <div class="row2">
        <div>
          <label>Client</label>
          <input type="text" id="dClient" value="${escapeHtml(data.client)}" placeholder="Nom du client" list="dClientList">
          ${clientsDatalistHtml('dClientList')}
        </div>
        <div>
          <label>Date d'émission</label>
          <input type="date" id="dDate" value="${data.date||''}">
        </div>
      </div>

      <label>Adresse du client</label>
      <textarea id="dAdresse" placeholder="Adresse postale du client">${escapeHtml(data.adresseClient||'')}</textarea>

      <div class="row2">
        <div>
          <label>Validité (jours)</label>
          <input type="text" id="dValidite" value="${data.validiteJours||30}">
        </div>
        <div>
          <label>TVA (%)</label>
          <div class="devis-tva-input"><input type="text" id="dTva" value="${data.tva!=null?data.tva:20}"><span>%</span></div>
        </div>
      </div>

      <label>Lignes de prestation</label>
      <div class="devis-lines-table-wrap">
        <table class="devis-lines-table" id="dLinesTable">
          <thead><tr>
            <th style="width:40%">Désignation</th><th style="width:12%">Qté</th><th style="width:12%">Unité</th>
            <th style="width:16%">Prix unit. HT</th><th style="width:16%">Total HT</th><th></th>
          </tr></thead>
          <tbody id="dLinesBody">
            ${data.lignes.map(l=>devisLineRowHtml(l)).join('')}
          </tbody>
        </table>
      </div>
      <button type="button" class="btn-add-line" id="dAddLine">+ Ajouter une ligne</button>

      <div class="devis-totals" id="dTotals">
        <div class="devis-totals-row"><span>Total HT</span><span id="dTotalHT">${fmtMontant(totals.totalHT)}</span></div>
        <div class="devis-totals-row"><span>TVA</span><span id="dTotalTVA">${fmtMontant(totals.montantTva)}</span></div>
        <div class="devis-totals-row grand"><span>Total TTC</span><span id="dTotalTTC">${fmtMontant(totals.totalTTC)}</span></div>
      </div>

      <label>Notes / conditions</label>
      <textarea id="dNotes" placeholder="Conditions de paiement, délais, précisions…">${escapeHtml(data.notes||'')}</textarea>

      <div class="modal-actions">
        ${mode==='edit' ? `<button class="btn-danger" id="dDelete">Supprimer</button>` : ''}
        <button class="btn-export" id="dPrint" style="flex:0;">🖨 Imprimer / PDF</button>
        <button class="btn-primary" id="dSave">${mode==='new' ? 'Créer le devis' : 'Enregistrer'}</button>
      </div>
      ${mode==='edit' ? `
      <div class="modal-actions" style="margin-top:8px;">
        <button class="btn-export" id="dToChantier">→ Transformer en chantier</button>
        <button class="btn-export" id="dToFacture">🧾 Générer une facture</button>
        <button class="btn-export" id="dDuplicate">⧉ Dupliquer</button>
      </div>` : ''}
      <div class="saving-note">Visible par Alexis et Yoann</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay) closeDevisModal(); };
  document.getElementById('dClose').onclick = closeDevisModal;

  document.getElementById('dStatutDevis').querySelectorAll('.status-opt').forEach(opt=>{
    opt.onclick = () => {
      document.getElementById('dStatutDevis').querySelectorAll('.status-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      data.statutDevis = opt.dataset.val;
    };
  });

  const dToChantier = document.getElementById('dToChantier');
  if(dToChantier) dToChantier.onclick = async () => {
    data.client = document.getElementById('dClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('dAdresse').value.trim();
    data.statutDevis = 'accepte';
    const idx = devisListData.findIndex(x=>x.id===data.id);
    if(idx>-1) devisListData[idx] = data;
    await saveDevisList();
    closeDevisModal();
    appView = 'chantiers';
    await openModal('new', null, {
      client: data.client,
      adresse: data.adresseClient,
      notes: `Créé depuis le devis ${data.numero}.`,
    });
  };

  const dToFacture = document.getElementById('dToFacture');
  if(dToFacture) dToFacture.onclick = () => {
    data.client = document.getElementById('dClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('dAdresse').value.trim();
    closeDevisModal();
    appView = 'factures';
    openFactureModal('new', null, data);
  };

  const dDuplicate = document.getElementById('dDuplicate');
  if(dDuplicate) dDuplicate.onclick = () => {
    data.client = document.getElementById('dClient').value.trim();
    data.adresseClient = document.getElementById('dAdresse').value.trim();
    closeDevisModal();
    openDevisModal('new', null, {...data, chantierId:''});
  };

  document.getElementById('dChantier').onchange = (e) => {
    data.chantierId = e.target.value;
    if(data.chantierId){
      const c = chantiers.find(x=>x.id===data.chantierId);
      if(c && !data.client) { data.client = c.client; document.getElementById('dClient').value = c.client||''; }
    }
  };

  function recalcTotals(){
    const t = computeDevisTotals(data);
    document.getElementById('dTotalHT').textContent = fmtMontant(t.totalHT);
    document.getElementById('dTotalTVA').textContent = fmtMontant(t.montantTva);
    document.getElementById('dTotalTTC').textContent = fmtMontant(t.totalTTC);
  }

  function bindLineRow(row, line){
    const desInput = row.querySelector('.col-des input');
    const qteInput = row.querySelector('.col-qte input');
    const uniteInput = row.querySelector('.col-unite input');
    const prixInput = row.querySelector('.col-prix input');
    const totalSpan = row.querySelector('.devis-line-total');
    const rmBtn = row.querySelector('.devis-line-rm');

    desInput.oninput = () => { line.designation = desInput.value; };
    uniteInput.oninput = () => { line.unite = uniteInput.value; };
    qteInput.oninput = () => {
      line.quantite = parseFloat(qteInput.value.replace(',','.')) || 0;
      totalSpan.textContent = fmtMontant(line.quantite * line.prixUnitaire);
      recalcTotals();
    };
    prixInput.oninput = () => {
      line.prixUnitaire = parseFloat(prixInput.value.replace(',','.')) || 0;
      totalSpan.textContent = fmtMontant(line.quantite * line.prixUnitaire);
      recalcTotals();
    };
    rmBtn.onclick = () => {
      data.lignes = data.lignes.filter(l=>l.id!==line.id);
      row.remove();
      recalcTotals();
    };
  }

  document.querySelectorAll('#dLinesBody tr').forEach(row=>{
    const line = data.lignes.find(l=>l.id===row.dataset.id);
    if(line) bindLineRow(row, line);
  });

  document.getElementById('dTva').oninput = (e) => {
    data.tva = parseFloat(e.target.value.replace(',','.')) || 0;
    recalcTotals();
  };

  document.getElementById('dAddLine').onclick = () => {
    const line = newDevisLine();
    data.lignes.push(line);
    const tbody = document.getElementById('dLinesBody');
    tbody.insertAdjacentHTML('beforeend', devisLineRowHtml(line));
    const row = tbody.querySelector(`tr[data-id="${line.id}"]`);
    bindLineRow(row, line);
  };

  document.getElementById('dPrint').onclick = () => {
    data.client = document.getElementById('dClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('dAdresse').value.trim();
    data.date = document.getElementById('dDate').value;
    data.validiteJours = document.getElementById('dValidite').value;
    data.notes = document.getElementById('dNotes').value.trim();
    printDevis(data);
  };

  document.getElementById('dSave').onclick = async () => {
    data.client = document.getElementById('dClient').value.trim();
    data.clientId = resolveClientId(data.client);
    data.adresseClient = document.getElementById('dAdresse').value.trim();
    data.date = document.getElementById('dDate').value;
    data.validiteJours = document.getElementById('dValidite').value;
    data.notes = document.getElementById('dNotes').value.trim();
    data.lignes = data.lignes.filter(l=>l.designation.trim()!=='' || l.quantite || l.prixUnitaire);

    if(mode==='new'){
      data.numero = await nextDevisNumero();
      data.createdAt = Date.now();
      devisListData.unshift(data);
    }else{
      const idx = devisListData.findIndex(d=>d.id===data.id);
      devisListData[idx] = data;
    }
    await saveDevisList();
    closeDevisModal();
    render();
  };

  if(mode==='edit'){
    document.getElementById('dDelete').onclick = async () => {
      if(!confirm('Supprimer ce devis ?')) return;
      devisListData = devisListData.filter(d=>d.id!==data.id);
      await saveDevisList();
      closeDevisModal();
      render();
    };
  }
}

// ---------- Flotte (véhicules) ----------

const TYPES_VEHICULE = [
  {id:'thermique', label:'Thermique'},
  {id:'electrique', label:'Électrique'},
  {id:'hybride', label:'Hybride'},
];
const typeVehiculeLabel = id => (TYPES_VEHICULE.find(t=>t.id===id)||{}).label || '—';

function echeanceStatus(dateStr){
  if(!dateStr) return null;
  const days = (new Date(dateStr) - new Date(toDateStr(new Date()))) / 86400000;
  if(days < 0) return 'retard';
  if(days <= 30) return 'bientot';
  return 'ok';
}

function echeanceChipHtml(label, dateStr){
  const status = echeanceStatus(dateStr);
  if(!status) return `<span class="ech-chip ech-vide">${label} non renseigné${label.endsWith('e')?'e':''}</span>`;
  const text = status==='retard' ? `${label} dépassé — ${fmtDate(dateStr)}` :
               status==='bientot' ? `${label} bientôt — ${fmtDate(dateStr)}` :
               `${label} — ${fmtDate(dateStr)}`;
  return `<span class="ech-chip ech-${status}">${text}</span>`;
}

function flotteSectionHtml(){
  const alertes = vehiculesListData.filter(v=>{
    const s1 = echeanceStatus(v.dateControleTechnique);
    const s2 = echeanceStatus(v.dateRevision);
    return s1==='retard' || s1==='bientot' || s2==='retard' || s2==='bientot';
  }).length;

  return `
    <div class="devis-toolbar">
      <p class="agenda-summary">${vehiculesListData.length} véhicule${vehiculesListData.length>1?'s':''}${alertes>0 ? ` · ${alertes} échéance${alertes>1?'s':''} à surveiller` : ''}</p>
      <button class="btn-new" id="btnNewVehicule">+ Nouveau véhicule</button>
    </div>
    <div class="devis-grid">
      ${vehiculesListData.length===0 ? `<div class="empty">${emptyIconSvg()}<strong>Aucun véhicule</strong>Ajoute les véhicules de l'entreprise pour suivre leurs échéances.</div>` :
        vehiculesListData.slice().sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).map(v=>vehiculeCardHtml(v)).join('')
      }
    </div>
  `;
}

function vehiculeCardHtml(v){
  return `
    <div class="devis-card" data-id="${v.id}">
      <div class="devis-card-numero">${escapeHtml(v.immatriculation||'—')}</div>
      <div class="devis-card-client">${escapeHtml(v.nom||'Véhicule sans nom')}</div>
      <div class="devis-card-chantier">${typeVehiculeLabel(v.type)}${v.conducteur ? ' · ' + escapeHtml(v.conducteur) : ''}${v.kilometrage ? ' · ' + Number(v.kilometrage).toLocaleString('fr-FR') + ' km' : ''}</div>
      <div class="ech-chip-row">
        ${echeanceChipHtml('Contrôle technique', v.dateControleTechnique)}
        ${echeanceChipHtml('Révision', v.dateRevision)}
      </div>
    </div>
  `;
}

  const btnNew = document.getElementById('btnNewVehicule');
  if(btnNew) btnNew.onclick = () => openVehiculeModal('new');
  app.querySelectorAll('.devis-card').forEach(el=>{
    el.onclick = () => openVehiculeModal('edit', vehiculesListData.find(v=>v.id===el.dataset.id));

function openVehiculeModal(mode, vehicule){
  const data = mode==='new' ? {
    id: uid(), nom:'', immatriculation:'', type:'thermique', conducteur:'',
    kilometrage:'', dateAchat:'', dateControleTechnique:'', dateRevision:'', dateAssurance:'', notes:''
  } : JSON.parse(JSON.stringify(vehicule));
  vehiculeModalState = {mode, data};
  renderVehiculeModal();
}

function closeVehiculeModal(){
  vehiculeModalState = null;
  const old = document.querySelector('.overlay');
  if(old) old.remove();
}

function renderVehiculeModal(){
  let old = document.querySelector('.overlay');
  if(old) old.remove();
  const {mode, data} = vehiculeModalState;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h2>${mode==='new' ? 'Nouveau véhicule' : (data.nom || 'Détail du véhicule')}</h2>
        <button class="icon-btn" id="vClose">✕</button>
      </div>

      <label>Nom du véhicule</label>
      <input type="text" id="vNom" value="${escapeHtml(data.nom)}" placeholder="Ex. Trafic Alexis, Break Yoann…">

      <div class="row2">
        <div>
          <label>Immatriculation</label>
          <input type="text" id="vImmat" value="${escapeHtml(data.immatriculation)}" placeholder="AA-123-BB">
        </div>
        <div>
          <label>Conducteur habituel</label>
          <input type="text" id="vConducteur" value="${escapeHtml(data.conducteur)}" placeholder="Alexis, Yoann, commun…">
        </div>
      </div>

      <label>Type</label>
      <div class="status-picker" id="vType">
        ${TYPES_VEHICULE.map(t=>`<div class="status-opt tyopt-${t.id==='electrique'?'detection':t.id==='hybride'?'amo':'topo'} ${data.type===t.id?'selected':''}" data-val="${t.id}">${t.label}</div>`).join('')}
      </div>

      <label>Kilométrage</label>
      <input type="text" id="vKm" value="${data.kilometrage||''}" placeholder="Ex. 45000">

      <div class="row2">
        <div>
          <label>Date d'achat</label>
          <input type="date" id="vDateAchat" value="${data.dateAchat||''}">
        </div>
        <div>
          <label>Échéance assurance</label>
          <input type="date" id="vDateAssurance" value="${data.dateAssurance||''}">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Prochain contrôle technique</label>
          <input type="date" id="vDateCT" value="${data.dateControleTechnique||''}">
        </div>
        <div>
          <label>Prochaine révision</label>
          <input type="date" id="vDateRevision" value="${data.dateRevision||''}">
        </div>
      </div>

      <label>Notes</label>
      <textarea id="vNotes" placeholder="Contrat de leasing, assureur, historique de pannes…">${escapeHtml(data.notes||'')}</textarea>

      <div class="modal-actions">
        ${mode==='edit' ? `<button class="btn-danger" id="vDelete">Supprimer</button>` : ''}
        <button class="btn-primary" id="vSave">${mode==='new' ? 'Ajouter le véhicule' : 'Enregistrer'}</button>
      </div>
      <div class="saving-note">Visible par Alexis et Yoann</div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.onclick = (e) => { if(e.target===overlay) closeVehiculeModal(); };
  document.getElementById('vClose').onclick = closeVehiculeModal;

  document.getElementById('vType').querySelectorAll('.status-opt').forEach(opt=>{
    opt.onclick = () => {
      document.getElementById('vType').querySelectorAll('.status-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      data.type = opt.dataset.val;
    };
  });

  document.getElementById('vSave').onclick = async () => {
    data.nom = document.getElementById('vNom').value.trim() || 'Véhicule sans nom';
    data.immatriculation = document.getElementById('vImmat').value.trim();
    data.conducteur = document.getElementById('vConducteur').value.trim();
    data.kilometrage = document.getElementById('vKm').value.trim();
    data.dateAchat = document.getElementById('vDateAchat').value;
    data.dateAssurance = document.getElementById('vDateAssurance').value;
    data.dateControleTechnique = document.getElementById('vDateCT').value;
    data.dateRevision = document.getElementById('vDateRevision').value;
    data.notes = document.getElementById('vNotes').value.trim();

    if(mode==='new'){
      vehiculesListData.unshift(data);
    }else{
      const idx = vehiculesListData.findIndex(v=>v.id===data.id);
      vehiculesListData[idx] = data;
    }
    await saveFlotteList();
    closeVehiculeModal();
    render();
  };

  if(mode==='edit'){
    document.getElementById('vDelete').onclick = async () => {
      if(!confirm('Supprimer ce véhicule ?')) return;
      vehiculesListData = vehiculesListData.filter(v=>v.id!==data.id);
      await saveFlotteList();
      closeVehiculeModal();
      render();
    };
  }
}
